[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "api-agent"
version = "0.1.0"
description = "Local API testing agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "pydantic-settings>=2.6,<3",
    "pywin32>=311; sys_platform == 'win32'",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.30,<1",
    "websockets>=15,<16",
    "pyyaml>=6,<7",
    "chromadb>=1.5.9",
]

[project.scripts]
api-agent = "api_agent.cli:main"
api-agent-mcp = "api_agent.tools.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/api_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest-tmp"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".pytest-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
